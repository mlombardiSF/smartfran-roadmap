name: Deploy Roadmap

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into HTML
        run: |
          sed -i "s|__ROADMAP_TOKEN__|${{ secrets.ROADMAP_TOKEN }}|g" index.html
          sed -i "s|__REPO_OWNER__|${{ github.repository_owner }}|g" index.html
          sed -i "s|__REPO_NAME__|${{ github.event.repository.name }}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4